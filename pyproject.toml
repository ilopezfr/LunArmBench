[project]
name = "lunarmbench-superdex-poc"
version = "0.1.0"
description = "LunArmBench SuperDex proof-of-concept: lunar connector insertion V0"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
authors = [{ name = "LunArmBench" }]
dependencies = [
    "superdex==1.0.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lunarmbench-run = "lunarmbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lunarmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
